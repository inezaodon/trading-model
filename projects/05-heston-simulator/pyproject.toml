[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heston-simulator"
version = "0.1.0"
description = "Heston stochastic volatility simulator (correlated Brownian + CIR variance)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Odon Ineza", email = "oineza@nd.edu" }]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]
# Optional: re-use the monorepo core-math implementation when installed.
core-math = [
  "trading-model-math",
]

[project.scripts]
heston-sim = "heston_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
