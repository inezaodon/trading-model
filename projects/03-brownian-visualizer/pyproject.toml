[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brownian-visualizer"
version = "0.1.0"
description = "Brownian motion & random walk visualizer (1D/2D Wiener processes) with chart-ready JSON"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Odon Ineza", email = "oineza@nd.edu" }]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
plot = [
  "matplotlib>=3.7",
]
dev = [
  "pytest>=7.4",
  "matplotlib>=3.7",
]

[project.scripts]
brownian-visualizer = "brownian_visualizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
