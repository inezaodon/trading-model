[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbm-simulator"
version = "0.1.0"
description = "Geometric Brownian Motion stock price simulator (SDE Monte Carlo)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Odon Ineza", email = "oineza@nd.edu" }]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]
plotly = [
  "plotly>=5.18",
]

[project.scripts]
gbm-sim = "gbm_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gbm_simulator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
