<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rough Volatility (Rough Bergomi) — Trading Model</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <header class="site-header" id="site-header"></header>
    <main>
      <div class="page-head">
        <div class="crumb">PROJECT · rough-vol</div>
        <h1>Rough Volatility (Rough Bergomi)</h1>
        <p>Fractional kernel / rough Bergomi paths for short-tenor skew realism (H ≈ 0.1).</p>
        <div class="math-blurb">v_t = ξ₀(t) exp(η√(2H) Z_t − ½ η² t^{2H})</div>
      </div>
      <div class="layout-run">
        <aside class="panel">
          <h2>Parameters</h2>
          <form id="run-form" class="form-grid">
          <label>Spot S₀<input name="s0" type="number" value="100" step="0.01" required /></label>
          <label>Drift μ<input name="mu" type="number" value="0" step="0.001" required /></label>
          <label>Hurst H<input name="hurst" type="number" value="0.1" step="0.01" required /></label>
          <label>Roughness η<input name="eta" type="number" value="1.5" step="0.01" required /></label>
          <label>Correlation ρ<input name="rho" type="number" value="-0.7" step="0.01" required /></label>
          <label>Forward var ξ₀<input name="xi0_flat" type="number" value="0.04" step="0.001" required /></label>
          <label>Horizon T<input name="t" type="number" value="1" step="0.01" required /></label>
          <label>Steps<input name="n_steps" type="number" value="126" step="1" required /></label>
          <label>Paths<input name="n_paths" type="number" value="4" step="1" required /></label>
          <label>Seed<input name="seed" type="number" value="42" step="1" required /></label>
            <div class="actions">
              <button class="btn btn-primary" type="submit">Run</button>
            </div>
          </form>
          <div class="status" id="status"></div>
        </aside>
        <section class="panel">
          <h2>Results</h2>
          <div class="chart-wrap"><canvas id="chart"></canvas></div>
          <div class="metrics" id="metrics"></div>
        </section>
      </div>
      <p class="disclaimer">Research demo. Not investment advice.</p>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="/js/app.js"></script>
    <script>
      TM.mountHeader("rough-vol");
      TM.mountFooter();
      TM.wireRunner({
        slug: "rough-vol",
        formId: "run-form",
        canvasId: "chart",
        statusId: "status",
        metricsId: "metrics",
        mode: "dual",
      });
    </script>
  </body>
</html>
