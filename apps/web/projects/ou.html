<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ornstein–Uhlenbeck Mean Reversion — Trading Model</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <header class="site-header" id="site-header"></header>
    <main>
      <div class="page-head">
        <div class="crumb">PROJECT · ou</div>
        <h1>Ornstein–Uhlenbeck Mean Reversion</h1>
        <p>Exact OU transitions for rates, Treasury spreads, and equity pair residuals (e.g. KO–PEP framing).</p>
        <div class="math-blurb">dX_t = κ(θ − X_t) dt + σ dW_t</div>
      </div>
      <div class="layout-run">
        <aside class="panel">
          <h2>Parameters</h2>
          <form id="run-form" class="form-grid">
          <label>X₀<input name="x0" type="number" value="0.5" step="0.01" required /></label>
          <label>Speed κ<input name="kappa" type="number" value="3" step="0.01" required /></label>
          <label>Level θ<input name="theta" type="number" value="0" step="0.01" required /></label>
          <label>Vol σ<input name="sigma" type="number" value="0.4" step="0.01" required /></label>
          <label>Horizon T<input name="t" type="number" value="2" step="0.01" required /></label>
          <label>Steps<input name="n_steps" type="number" value="500" step="1" required /></label>
          <label>Paths<input name="n_paths" type="number" value="8" step="1" required /></label>
          <label>Seed<input name="seed" type="number" value="11" step="1" required /></label>
            <div class="actions">
              <button class="btn btn-primary" type="submit">Run</button>
            </div>
          </form>
          <div class="status" id="status"></div>
        </aside>
        <section class="panel">
          <h2>Results</h2>
          <div class="chart-wrap"><canvas id="chart"></canvas></div>
          <div class="metrics" id="metrics"></div>
        </section>
      </div>
      <p class="disclaimer">Research demo. Not investment advice.</p>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="/js/app.js"></script>
    <script>
      TM.mountHeader("ou");
      TM.mountFooter();
      TM.wireRunner({
        slug: "ou",
        formId: "run-form",
        canvasId: "chart",
        statusId: "status",
        metricsId: "metrics",
        mode: "paths",
      });
    </script>
  </body>
</html>
